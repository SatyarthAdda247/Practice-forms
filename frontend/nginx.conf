server {
    # ${PORT} is substituted by the nginx docker-entrypoint (envsubst) at startup;
    # Cloud Run/PaaS inject PORT, defaulting to 8080 (see Dockerfile).
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight health/liveness endpoint (used by the container HEALTHCHECK
    # and any external probe).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Long-cache the fingerprinted build assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths render index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
