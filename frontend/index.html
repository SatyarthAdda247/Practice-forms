<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- OMR GradePro portal defaults. The public tools are separate products and
         each states its own title, description and canonical: routeMeta.js holds
         them, server.js applies them per request in production and vite.config.js
         does the same in dev, and usePageMeta keeps them right across
         client-side navigation. No canonical here on purpose — the portal routes
         behind this file are auth-gated and are not meant to be indexed. -->
    <title>OMR GradePro</title>
    <meta
      content="OMR sheet grading and answer key tools for competitive exam aspirants."
      name="description"
    />
    <meta content="OMR GradePro" property="og:title" />
    <meta
      content="OMR sheet grading and answer key tools for competitive exam aspirants."
      property="og:description"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
