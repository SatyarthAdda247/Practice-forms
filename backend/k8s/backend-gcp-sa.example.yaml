# Mount the BigQuery service-account key into the backend pod as a file.
#
# WHY: the app authenticates via GOOGLE_APPLICATION_CREDENTIALS, which must be a
# PATH TO A FILE. A crashing pod with:
#     DefaultCredentialsError: File /var/secrets/google/key.json was not found
# means this Secret volume is missing or mounted at the wrong path.
#
# INVARIANT: ConfigMap GOOGLE_APPLICATION_CREDENTIALS == volume mountPath + /key.json
#   ConfigMap: GOOGLE_APPLICATION_CREDENTIALS: "/var/secrets/google/key.json"
#   mountPath: /var/secrets/google   +   file: key.json
#
# ─────────────────────────────────────────────────────────────────────────────
# 1) Create the Secret from the real SA key (DO NOT commit the key file):
#
#    kubectl create secret generic omr-answer-key-checker-be-adda-stg-green-gcp-sa \
#      --from-file=key.json=backend/credential/adda247-dev-omr.json \
#      -n <namespace>
#
#    (prod: replace -stg- with -prod- in the name)
#
# The inline Secret below is a TEMPLATE for GitOps flows — leave stringData as a
# placeholder in git and inject the real key via a sealed-secret / SOPS / the
# kubectl command above. Never commit the private key.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: omr-answer-key-checker-be-adda-stg-green-gcp-sa
type: Opaque
stringData:
  key.json: |
    { "REPLACE_ME": "inject the service-account JSON here at deploy time" }
---
# 2) Patch the backend Deployment's pod spec (excerpt — merge into your existing
#    Deployment; do not apply this partial object as-is).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omr-answer-key-checker-be-adda-stg-green
spec:
  template:
    spec:
      containers:
        - name: backend
          envFrom:
            - configMapRef:
                name: omr-answer-key-checker-be-adda-stg-green
          volumeMounts:
            - name: gcp-sa
              mountPath: /var/secrets/google   # dir; file key.json lands inside
              readOnly: true
      volumes:
        - name: gcp-sa
          secret:
            secretName: omr-answer-key-checker-be-adda-stg-green-gcp-sa
            items:
              - key: key.json
                path: key.json                 # -> /var/secrets/google/key.json
